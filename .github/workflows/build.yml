name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm install @tauri-apps/cli
      - run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm install @tauri-apps/cli
      - run: npx tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  package:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: artifacts/

      - name: Assemble complete installation package
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          PKG="Bio-OM-Expert_${VERSION}_完整安装包"

          mkdir -p "${PKG}/Skills" "${PKG}/文档"

          # Copy installers
          cp artifacts/*.dmg "${PKG}/" 2>/dev/null || true
          cp artifacts/*.msi "${PKG}/" 2>/dev/null || true

          # Copy setup scripts
          cp setup.sh setup.bat "${PKG}/"

          # Copy Skills JSON (manifests)
          if [ -d "skills-manifest" ]; then
            cp skills-manifest/*.json "${PKG}/Skills/"
          fi

          # Copy Skills MD (SKILL.md implementations)
          if [ -d "skills" ]; then
            mkdir -p "${PKG}/Skills/skills"
            cp skills/*.md "${PKG}/Skills/skills/"
          fi

          # Copy CLAUDE.md
          if [ -f "CLAUDE.md" ]; then
            cp CLAUDE.md "${PKG}/Skills/"
          fi

          # Generate docs
          cp CHANGELOG.md README.md README-USER.md "${PKG}/文档/"

          # Package
          zip -r "${PKG}.zip" "${PKG}/"

      - uses: actions/upload-artifact@v4
        with:
          name: complete-package
          path: "Bio-OM-Expert_*-完整安装包.zip"

  release:
    needs: [build-macos, build-windows, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          make_latest: true
